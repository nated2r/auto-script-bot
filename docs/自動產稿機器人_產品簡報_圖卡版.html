<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>自動產稿機器人｜圖卡版簡報</title>
  <style>
    html, body { margin:0; height:100%; background:#0b1f3a; }
    .wrap { height:100%; display:grid; place-items:center; }
    img { width:min(96vw, calc(96vh * 16 / 9)); aspect-ratio:16/9; object-fit:cover; border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,.45); }
    .nav { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:8px; background:rgba(0,0,0,.55); padding:8px 12px; border-radius:999px; color:#fff; font-family:sans-serif; }
    button { border:0; background:#06c755; color:#0b1f3a; font-weight:800; border-radius:999px; padding:6px 14px; cursor:pointer; }
  </style>
</head>
<body>
  <div class="wrap"><img id="slide" alt="slide" /></div>
  <div class="nav">
    <button id="prev">上一頁</button>
    <span id="pos"></span>
    <button id="next">下一頁</button>
  </div>
  <script>
    const files = [
      'ppt-slides/slide-01-cover.png',
      'ppt-slides/slide-02-pain.png',
      'ppt-slides/slide-03-product.png',
      'ppt-slides/slide-04-modes.png',
      'ppt-slides/slide-05-rules.png',
      'ppt-slides/slide-06-steps.png',
    ]
    let i = 0
    const img = document.getElementById('slide')
    const pos = document.getElementById('pos')
    function render(){ img.src = files[i]; pos.textContent = `${i+1} / ${files.length}` }
    document.getElementById('prev').onclick = () => { if(i>0){i--; render()} }
    document.getElementById('next').onclick = () => { if(i<files.length-1){i++; render()} }
    window.addEventListener('keydown', e => {
      if(e.key==='ArrowRight'||e.key===' ') { e.preventDefault(); document.getElementById('next').click() }
      if(e.key==='ArrowLeft') { e.preventDefault(); document.getElementById('prev').click() }
    })
    render()
  </script>
</body>
</html>
